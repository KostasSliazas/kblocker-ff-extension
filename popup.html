<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>KBlocker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>KBlocker</h1>

    <div class="top">

      <input id="siteInput" type="text" placeholder="example.com">

      <button id="addBtn">
        Add
      </button>

      <button id="addTabBtn">
        Add current tab
      </button>

    </div>

    <ul id="siteList"></ul>

    <div class="bottom">

      <button id="clearBtn" class="remove">
        Clear All
      </button>

    </div>

  </div>

  <script src="popup.js"></script>

</body>

</html>
